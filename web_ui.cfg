[deepseek]
; API ключ за DeepSeek (https://platform.deepseek.com/api_keys)
api_key = твоя_API_ключ
; Базов адрес на DeepSeek (OpenAI-съвместим API)
base_url = https://api.deepseek.com
; Модел: deepseek-chat (V3) или deepseek-reasoner (R1)
model = deepseek-chat
; Таймаут за заявката в секунди (анализът може да отнеме време)
timeout = 300

[notifications]
enabled = false
keywords = 
organization = 
object = 
emails = 

[smtp]
host = smtp.gmail.com
port = 587
username = 
password = 
from = 
use_tls = true
